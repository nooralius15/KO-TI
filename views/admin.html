<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <style>
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #eee; border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: #333; color: #fff; }
        .payment-paid { color: #28a745; font-weight: bold; }
        .payment-unpaid { color: #dc3545; font-weight: bold; }
        .payment-failed { color: #dc3545; font-weight: bold; }
        .payment-refunded { color: #007bff; font-weight: bold; }
        .stock-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .stock-ok { background: #d4edda; color: #155724; }
        .stock-low { background: #fff3cd; color: #856404; }
        .stock-out { background: #f8d7da; color: #721c24; }
        .status-active { color: #28a745; font-weight: bold; }
        .status-inactive { color: #dc3545; font-weight: bold; }
        .product-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .edit-input { width: 80px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; }
        .edit-input-wide { width: 150px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; }
        
        .status-new { color: #007bff; font-weight: bold; }
        .status-contacted { color: #ffc107; font-weight: bold; }
        .status-approved { color: #28a745; font-weight: bold; }
        .status-rejected { color: #dc3545; font-weight: bold; }
    </style>
</head>

<body style="padding-top: 120px;">
    <header>
        <div class="nav container">
            <a href="/" class="logo">🐾 KOTI Admin</a>
            <i class="bx bx-menu" id="menu-icon"></i>
            <div class="navbar" id="nav-menu">
                <a href="/admin" class="nav-link">ORDERS</a>
                <a href="/dashboard" id="userDashboardLink" class="nav-link">My Account</a>
            </div>
            <div>
                <a href="/logout">
                    <i class="bx bx-log-out" id="user-icon"></i>
                </a>
            </div>
        </div>
    </header>

    <div id="admin-toast" class="admin-toast">Message</div>

    <div class="dashboard-container">
        <h2>Admin Dashboard</h2>
        
        <!-- Tab Buttons -->
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="ordersTab">Orders</button>
            <button class="tab-btn" data-tab="productsTab">Products</button>
            <button class="tab-btn" data-tab="adoptionsTab">Adoptions</button>
        </div>

        <section id="ordersTab" class="tab-section active">
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
            </table>

            <div id="orderDetailsContainer" style="margin-top: 40px;"></div>
        </section>

        <section id="productsTab" class="tab-section">
            <!-- Add Product Form -->
            <div class="dashboard-card" style="margin-bottom: 30px;">
                <h3>Add New Product</h3>
                <form id="addProductForm" enctype="multipart/form-data">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <label for="newTitle">Product Title</label>
                            <input type="text" id="newTitle" placeholder="Product name..." required />
                        </div>
                        <div>
                            <label for="newPrice">Price ($)</label>
                            <input type="number" id="newPrice" step="0.01" min="0.01" placeholder="0.00" required />
                        </div>
                        <div>
                            <label for="newStock">Stock Quantity</label>
                            <input type="number" id="newStock" min="0" value="100" required />
                        </div>
                        <div>
                            <label for="newImage">Product Image</label>
                            <input type="file" id="newImage" accept="image/*" required />
                        </div>
                    </div>
                    <button type="submit" style="margin-top: 15px;">Add Product</button>
                </form>
            </div>

            <!-- Products Table -->
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </section>

        <section id="adoptionsTab" class="tab-section">
            <h3>Adoption Inquiries</h3>
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Pet</th>
                        <th>Applicant</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adoptionsTableBody"></tbody>
            </table>
        </section>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/menu.js"></script>
    <script>
        // Tab Switching
        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
                button.classList.add('active');
                document.getElementById(button.dataset.tab).classList.add('active');
            });
        });

        // Toast Function
        function showToast(msg) {
            const toast = document.getElementById('admin-toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Orders Logic
        function changeStatus(orderId) {
            const td = document.getElementById(`status-${orderId}`);
            const currentStatus = td.innerText.trim();

            const select = document.createElement("select");
            ["pending", "confirmed", "shipped", "delivered", "canceled"].forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.text = status.charAt(0).toUpperCase() + status.slice(1);
                if (status === currentStatus) option.selected = true;
                select.appendChild(option);
            });

            const saveBtn = document.createElement("button");
            saveBtn.textContent = "Save";
            saveBtn.className = "btn btn-update";
            saveBtn.style.marginLeft = "10px";

            td.innerHTML = "";
            td.appendChild(select);
            td.appendChild(saveBtn);

            saveBtn.addEventListener("click", () => {
                const newStatus = select.value;
                fetch(`/admin/orders/${orderId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        td.innerText = newStatus;
                    } else {
                        td.innerText = currentStatus;
                        showToast("Update failed.");
                    }
                });
            });
        }

        function deleteOrder(orderId) {
            if (!confirm("Are you sure you want to delete this order?")) return;
            fetch(`/admin/orders/${orderId}`, {
                method: 'DELETE'
            }).then(res => res.json()).then(data => {
                if (data.message) {
                    location.reload();
                } else {
                    showToast("Failed to delete.");
                }
            });
        }

        function showOrderDetails(orderId) {
            document.querySelectorAll('.order-detail-box').forEach(div => div.style.display = 'none');
            const box = document.getElementById(`order-detail-${orderId}`);
            if (box) box.style.display = 'block';
        }

        function loadOrders() {
            fetch('/admin/orders-with-items')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('ordersTableBody');
                    const detailsBox = document.getElementById('orderDetailsContainer');
                    tbody.innerHTML = "";
                    detailsBox.innerHTML = "";

                    data.forEach(order => {
                        const total = parseFloat(order.total).toFixed(2);
                        const payClass = 'payment-' + (order.payment_status || 'unpaid');
                        
                        tbody.innerHTML += `
                            <tr>
                                <td>${escapeHtml(order.id)}</td>
                                <td>${escapeHtml(order.name)}</td>
                                <td>${escapeHtml(order.email)}</td>
                                <td>$${escapeHtml(total)}</td>
                                <td>${escapeHtml(new Date(order.created_at).toLocaleDateString())}</td>
                                <td><span class="${payClass}">${escapeHtml(order.payment_status || 'unpaid')}</span></td>
                                <td><span id="status-${escapeHtml(order.id)}">${escapeHtml(order.status || 'pending')}</span></td>
                                <td>
                                    <button onclick="showOrderDetails(${order.id})" class="btn btn-info">View Details</button>
                                    <button onclick="changeStatus(${order.id})" class="btn btn-update">Update</button>
                                    <button onclick="deleteOrder(${order.id})" class="btn btn-danger">Delete</button>
                                </td>
                            </tr>
                        `;

                        const productsHtml = order.items.map(item => `
                            <tr>
                                <td>${escapeHtml(item.name)}</td>
                                <td>$${escapeHtml(parseFloat(item.price).toFixed(2))}</td>
                                <td>${escapeHtml(item.quantity)}</td>
                                <td>$${escapeHtml(parseFloat(item.subtotal).toFixed(2))}</td>
                            </tr>
                        `).join('');

                        detailsBox.innerHTML += `
                            <div id="order-detail-${order.id}" class="order-detail-box" style="display: none;">
                                <h4>Order #${escapeHtml(order.id)} (${escapeHtml(new Date(order.created_at).toLocaleDateString())})</h4>
                                <div class="order-detail-grid">
                                    <p><strong>Name:</strong> ${escapeHtml(order.name)}</p>
                                    <p><strong>Email:</strong> ${escapeHtml(order.email)}</p>
                                    <p><strong>Address:</strong> ${escapeHtml(order.address)}</p>
                                    <p><strong>Phone:</strong> ${escapeHtml(order.phone)}</p>
                                    <p><strong>Status:</strong> ${escapeHtml(order.status)}</p>
                                    <p><strong>Payment Status:</strong> <span class="${payClass}">${escapeHtml(order.payment_status || 'unpaid')}</span></p>
                                </div>
                                <table class="dashboard-table" style="margin-top: 20px;">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Price</th>
                                            <th>Qty</th>
                                            <th>Subtotal</th>
                                        </tr>
                                    </thead>
                                    <tbody>${productsHtml}</tbody>
                                    <tfoot>
                                        <tr>
                                            <td colspan="3" style="text-align:right;"><strong>Total:</strong></td>
                                            <td><strong>$${escapeHtml(total)}</strong></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        `;
                    });
                });
        }

        // Products Logic
        function loadProducts() {
            fetch('/admin/products')
                .then(res => res.json())
                .then(products => {
                    const tbody = document.getElementById('productsTableBody');
                    tbody.innerHTML = '';
                    products.forEach(product => {
                        const stockClass = product.stock_quantity === 0 ? 'stock-out' : product.stock_quantity <= 10 ? 'stock-low' : 'stock-ok';
                        const statusClass = product.is_active ? 'status-active' : 'status-inactive';
                        tbody.innerHTML += `
                            <tr id="product-row-${product.id}">
                                <td>${escapeHtml(product.id)}</td>
                                <td><img src="/${escapeHtml(product.image)}" class="product-thumb" alt="${escapeHtml(product.title)}" /></td>
                                <td>${escapeHtml(product.title)}</td>
                                <td>$${escapeHtml(parseFloat(product.price).toFixed(2))}</td>
                                <td><span class="stock-badge ${stockClass}">${escapeHtml(product.stock_quantity)}</span></td>
                                <td><span class="${statusClass}">${product.is_active ? 'Active' : 'Inactive'}</span></td>
                                <td>
                                    <button onclick="editProduct(${product.id})" class="btn btn-update">Edit</button>
                                    ${product.is_active 
                                        ? `<button onclick="deactivateProduct(${product.id})" class="btn btn-danger">Deactivate</button>`
                                        : `<button onclick="reactivateProduct(${product.id})" class="btn btn-info">Reactivate</button>`
                                    }
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('newTitle').value);
            formData.append('price', document.getElementById('newPrice').value);
            formData.append('stock_quantity', document.getElementById('newStock').value);
            formData.append('image', document.getElementById('newImage').files[0]);

            const res = await fetch('/admin/products', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                showToast('Product added successfully!');
                document.getElementById('addProductForm').reset();
                loadProducts();
            } else {
                showToast(data.message || 'Failed to add product');
            }
        });

        function editProduct(productId) {
            const row = document.getElementById(`product-row-${productId}`);
            const cells = row.querySelectorAll('td');
            const currentTitle = cells[2].textContent;
            const currentPrice = cells[3].textContent.replace('$', '');
            const currentStock = cells[4].textContent;

            cells[2].innerHTML = `<input type="text" class="edit-input-wide" value="${escapeHtml(currentTitle)}" id="edit-title-${productId}" />`;
            cells[3].innerHTML = `<input type="number" class="edit-input" step="0.01" value="${currentPrice}" id="edit-price-${productId}" />`;
            cells[4].innerHTML = `<input type="number" class="edit-input" value="${currentStock}" id="edit-stock-${productId}" />`;
            cells[6].innerHTML = `
                <button onclick="saveProduct(${productId})" class="btn btn-update">Save</button>
                <button onclick="loadProducts()" class="btn btn-info">Cancel</button>
            `;
        }

        async function saveProduct(productId) {
            const title = document.getElementById(`edit-title-${productId}`).value;
            const price = document.getElementById(`edit-price-${productId}`).value;
            const stock_quantity = document.getElementById(`edit-stock-${productId}`).value;

            const formData = new FormData();
            formData.append('title', title);
            formData.append('price', price);
            formData.append('stock_quantity', stock_quantity);

            const res = await fetch(`/admin/products/${productId}`, { method: 'PUT', body: formData });
            const data = await res.json();
            if (data.success) {
                showToast('Product updated!');
                loadProducts();
            } else {
                showToast(data.message || 'Update failed');
            }
        }

        async function deactivateProduct(productId) {
            if (!confirm('Deactivate this product? It will be hidden from the store.')) return;
            const res = await fetch(`/admin/products/${productId}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) { showToast('Product deactivated'); loadProducts(); }
            else showToast(data.message || 'Failed');
        }

        async function reactivateProduct(productId) {
            const formData = new FormData();
            formData.append('is_active', '1');
            const res = await fetch(`/admin/products/${productId}`, { method: 'PUT', body: formData });
            const data = await res.json();
            if (data.success) { showToast('Product reactivated!'); loadProducts(); }
            else showToast(data.message || 'Failed');
        }

        // ── Adoptions ──
        function loadAdoptions() {
            fetch('/admin/adoption-inquiries')
                .then(res => res.json())
                .then(inquiries => {
                    const tbody = document.getElementById('adoptionsTableBody');
                    tbody.innerHTML = '';
                    if (!Array.isArray(inquiries) || inquiries.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="9">No adoption inquiries yet.</td></tr>';
                        return;
                    }
                    inquiries.forEach(inq => {
                        const statusClass = 'status-' + inq.status;
                        tbody.innerHTML += `
                            <tr>
                                <td>${escapeHtml(inq.id)}</td>
                                <td>${escapeHtml(inq.pet_name)}</td>
                                <td>${escapeHtml(inq.applicant_name)}</td>
                                <td>${escapeHtml(inq.applicant_email)}</td>
                                <td>${escapeHtml(inq.applicant_phone || '—')}</td>
                                <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(inq.message || '')}">${escapeHtml(inq.message || '—')}</td>
                                <td>${escapeHtml(new Date(inq.created_at).toLocaleDateString())}</td>
                                <td><span class="${statusClass}">${escapeHtml(inq.status)}</span></td>
                                <td>
                                    <select onchange="updateAdoptionStatus(${inq.id}, this.value)" style="padding: 4px; border-radius: 4px;">
                                        <option value="new" ${inq.status === 'new' ? 'selected' : ''}>New</option>
                                        <option value="contacted" ${inq.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                        <option value="approved" ${inq.status === 'approved' ? 'selected' : ''}>Approved</option>
                                        <option value="rejected" ${inq.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    </select>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        async function updateAdoptionStatus(id, status) {
            const res = await fetch(`/admin/adoption-inquiries/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const data = await res.json();
            if (data.success) {
                showToast('Inquiry status updated!');
                loadAdoptions();
            } else {
                showToast(data.message || 'Update failed');
            }
        }

        // Initialize
        loadOrders();
        loadProducts();
        loadAdoptions();
    </script>
</body>
</html>
