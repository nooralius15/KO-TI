<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>

    <!-- Header -->
    <header>
        <!-- Nav -->
        <div class="nav container">
            <!-- Logo -->
            <a href="/" class="logo">🐾 KOTI</a>
            <!-- Navbar -->
            <i class="bx bx-menu" id="menu-icon"></i>
            <div class="navbar" id="nav-menu">
                <a href="/index.html#home" class="nav-link">HOME</a>
                <a href="/index.html#products" class="nav-link">PRODUCTS</a>
                <a href="/index.html#adoption" class="nav-link">ADOPTION</a>
                <a href="/index.html#about-us" class="nav-link">ABOUT</a>
            </div>
            <!-- Icons -->
            <div>
                <!-- Cart-Icon -->
                <a href="cart.html">
                    <i class="bx bx-shopping-bag" id="cart-icon" data-quantity="0"></i>
                </a>
                <!-- User Icon Dropdown -->
                <a>
                    <i class="bx bx-user" id="user-icon"></i>
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-form">
          <h2>Reset Password</h2>
          <div id="msgBox" style="display:none;"></div>
          <form id="resetPasswordForm">
            <input type="password" id="newPassword" name="password" placeholder="New Password" required />
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
            <button type="submit">Reset Password</button>
          </form>
          <p><a href="login.html">Back to Login</a></p>
        </div>
    </div>
    <style>
      .auth-error { color: #dc3545; background: #fff0f0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
      .auth-success { color: #28a745; background: #f0fff0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const msgBox = document.getElementById('msgBox');
      const form = document.getElementById('resetPasswordForm');
      
      if (!token) {
          msgBox.style.display = 'block';
          msgBox.className = 'auth-error';
          msgBox.textContent = 'Invalid or missing reset token';
          form.querySelector('button').disabled = true;
      }
      
      form.addEventListener('submit', function(e) {
          e.preventDefault();
          const password = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;
          
          if (password !== confirmPassword) {
              msgBox.style.display = 'block';
              msgBox.className = 'auth-error';
              msgBox.textContent = 'Passwords do not match';
              return;
          }
          
          fetch('/api/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, password })
          })
          .then(res => res.json())
          .then(data => {
              msgBox.style.display = 'block';
              if (data.success) {
                  msgBox.className = 'auth-success';
                  msgBox.innerHTML = 'Password reset successfully! <a href="login.html">Login here</a>';
                  form.reset();
              } else {
                  msgBox.className = 'auth-error';
                  msgBox.textContent = data.error || 'Failed to reset password';
              }
          })
          .catch(err => {
              msgBox.style.display = 'block';
              msgBox.className = 'auth-error';
              msgBox.textContent = 'Network error occurred';
          });
      });
    </script>

    <!-- Link To JS -->
    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
