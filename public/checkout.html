<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="css/checkout.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>

    <div class="checkout-container">
        <h2>Confirm Your Order</h2>

        <!-- Products Summary -->
        <section class="summary-section">
            <h3>Your Items</h3>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="cartSummary"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="2"><strong>Total Amount</strong></td>
                        <td id="totalAmount">$0.00</td>
                    </tr>
                </tfoot>
            </table>

            <!-- ✅ Back to Cart Button -->
            <div style="text-align: right; margin-top: 20px;">
                <a href="cart.html" class="back-cart-btn">← Back to Cart</a>
            </div>
        </section>

        <!-- Address and Contact Info -->
        <section class="details-section">
            <h3>Your Information</h3>
            <form id="checkoutForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required />

                <label for="address">Shipping Address</label>
                <input type="text" id="address" name="address" required />

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required />

                <div id="checkoutError" style="display: none; background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-top: 15px; margin-bottom: 15px; font-weight: 500; font-size: 14px; border: 1px solid #ef9a9a;"></div>

                <button type="submit" id="payNow">Pay Now</button>
            </form>
        </section>
    </div>

    <script src="js/utils.js"></script>
    <script>
        // Load cart from localStorage
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let total = 0;
        const cartBody = document.getElementById("cartSummary");

        if (cart.length === 0) {
            cartBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Your cart is empty.</td></tr>';
        } else {
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                const row = document.createElement("tr");
                row.innerHTML = `
            <td>${escapeHtml(item.title)}</td>
            <td>${escapeHtml(item.quantity)}</td>
            <td>$${escapeHtml(subtotal.toFixed(2))}</td>
          `;
                cartBody.appendChild(row);
            });
        }

        document.getElementById("totalAmount").textContent = `$${total.toFixed(2)}`;

        // Fetch user info
        fetch('/api/user')
            .then(res => {
                if (!res.ok) return window.location.href = '/login';
                return res.json();
            })
            .then(user => {
                document.getElementById("name").value = user.name || '';
                document.getElementById("address").value = user.address || '';
                document.getElementById("phone").value = user.phone || '';
            });

        function showCheckoutError(msg) {
            const errBox = document.getElementById("checkoutError");
            errBox.textContent = msg;
            errBox.style.display = "block";
            errBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearCheckoutError() {
            const errBox = document.getElementById("checkoutError");
            errBox.style.display = "none";
            errBox.textContent = "";
        }

        // Submit payment
        document.getElementById("checkoutForm").addEventListener("submit", async e => {
            e.preventDefault();
            clearCheckoutError();

            if (!Array.isArray(cart) || cart.length === 0) {
                return showCheckoutError("Your cart is empty. Please add products before checking out.");
            }

            const name = document.getElementById("name").value.trim();
            const address = document.getElementById("address").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (!name || !address || !phone) {
                return showCheckoutError("All fields (Name, Address, Phone) are required.");
            }

            const payBtn = document.getElementById("payNow");
            payBtn.disabled = true;
            payBtn.textContent = "Processing Checkout...";

            try {
                // Update user profile before payment
                await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, address, phone })
                });

                // Proceed to Stripe session
                const res = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: cart, name, address, phone })
                });

                const data = await res.json();
                if (res.ok && data.url) {
                    localStorage.removeItem("cart");
                    window.location.href = data.url;
                } else {
                    showCheckoutError(data.error || "Unable to proceed with checkout. Please try again.");
                    payBtn.disabled = false;
                    payBtn.textContent = "Pay Now";
                }
            } catch (err) {
                showCheckoutError("Network error. Please check your connection and try again.");
                payBtn.disabled = false;
                payBtn.textContent = "Pay Now";
            }
        });
    </script>
    <!-- Link To JS -->
    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
