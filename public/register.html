<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>

    <!-- Header -->
    <header>
        <!-- Nav -->
        <div class="nav container">
            <!-- Logo -->
            <a href="/" class="logo">🐾 KOTI</a>
            <!-- Navbar -->
            <i class="bx bx-menu" id="menu-icon"></i>
            <div class="navbar" id="nav-menu">
                <a href="/index.html#home" class="nav-link">HOME</a>
                <a href="/index.html#products" class="nav-link">PRODUCTS</a>
                <a href="/index.html#adoption" class="nav-link">ADOPTION</a>
                <a href="/index.html#about-us" class="nav-link">ABOUT</a>
            </div>
            <!-- Icons -->
            <div>
                <!-- Cart-Icon -->
                <a href="cart.html">
                    <i class="bx bx-shopping-bag" id="cart-icon" data-quantity="0"></i>
                </a>
                <!-- User Icon Dropdown -->
                <a>
                    <i class="bx bx-user" id="user-icon"></i>
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-form">
          <h2>Register</h2>
          <div id="regError" class="auth-error" style="display:none;"></div>
          <form id="registerForm">
            <input type="text" id="regName" name="name" placeholder="Full Name" required />
            <input type="email" id="regEmail" name="email" placeholder="Email" required />
            <input type="password" id="regPassword" name="password" placeholder="Password" required />
            <button type="submit">Register</button>
          </form>
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    <style>
      .auth-error { color: #dc3545; background: #fff0f0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
    <script>
      document.getElementById('registerForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const name = document.getElementById('regName').value;
          const email = document.getElementById('regEmail').value;
          const password = document.getElementById('regPassword').value;
          
          fetch('/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, password })
          })
          .then(res => res.json())
          .then(data => {
              if (data.success) {
                  window.location.href = data.redirect;
              } else {
                  const errDiv = document.getElementById('regError');
                  errDiv.textContent = data.error || 'Registration failed';
                  errDiv.style.display = 'block';
              }
          })
          .catch(err => {
              const errDiv = document.getElementById('regError');
              errDiv.textContent = 'Network error occurred';
              errDiv.style.display = 'block';
          });
      });
    </script>
    <!-- Link To JS -->
    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
