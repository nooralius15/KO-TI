<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>

    <!-- Header -->
    <header>
        <!-- Nav -->
        <div class="nav container">
            <!-- Logo -->
            <a href="/" class="logo">🐾 KOTI</a>
            <!-- Navbar -->
            <i class="bx bx-menu" id="menu-icon"></i>
            <div class="navbar" id="nav-menu">
                <a href="/index.html#home" class="nav-link">HOME</a>
                <a href="/index.html#products" class="nav-link">PRODUCTS</a>
                <a href="/index.html#adoption" class="nav-link">ADOPTION</a>
                <a href="/index.html#about-us" class="nav-link">ABOUT</a>
            </div>
            <!-- Icons -->
            <div>
                <!-- Cart-Icon -->
                <a href="cart.html">
                    <i class="bx bx-shopping-bag" id="cart-icon" data-quantity="0"></i>
                </a>
                <!-- User Icon Dropdown -->
                <a>
                    <i class="bx bx-user" id="user-icon"></i>
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-form">
          <h2>Forgot Password</h2>
          <p style="text-align: center; margin-bottom: 20px;">Enter your email and we'll send you a reset link.</p>
          <div id="msgBox" style="display:none;"></div>
          <form id="forgotPasswordForm">
            <input type="email" id="fpEmail" name="email" placeholder="Email" required />
            <button type="submit">Send Reset Link</button>
          </form>
          <p><a href="login.html">Back to Login</a></p>
        </div>
    </div>
    <style>
      .auth-error { color: #dc3545; background: #fff0f0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
      .auth-success { color: #28a745; background: #f0fff0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
    <script>
      document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const email = document.getElementById('fpEmail').value;
          const msgBox = document.getElementById('msgBox');
          
          fetch('/api/forgot-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
          })
          .then(res => res.json())
          .then(data => {
              msgBox.style.display = 'block';
              if (data.success) {
                  msgBox.className = 'auth-success';
                  msgBox.textContent = 'If an account exists with that email, a reset link has been sent.';
              } else {
                  msgBox.className = 'auth-error';
                  msgBox.textContent = data.error || 'Failed to send reset link';
              }
          })
          .catch(err => {
              msgBox.style.display = 'block';
              msgBox.className = 'auth-error';
              msgBox.textContent = 'Network error occurred';
          });
      });
    </script>

    <!-- Link To JS -->
    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
</body>

</html>
