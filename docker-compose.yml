version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: koti-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: koti_root_pass
      MARIADB_DATABASE: koti
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./koti.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: koti-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASS: koti_root_pass
      DB_NAME: koti
      SESSION_SECRET: docker-session-secret-change-in-production
      STRIPE_SECRET_KEY: sk_test_placeholder_key
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    volumes:
      - uploads:/app/public/images

volumes:
  db_data:
  uploads:
